name: Pull request checks
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/bin_builder.cjs
      - run: python scripts/generate_ops_profiles.py --check
      - run: node tests/ops_profiles.cjs
      - run: python scripts/verify_generated.py artifacts/ops-tests/garden
      - run: python scripts/verify_generated.py artifacts/ops-tests/graveyard
      - run: python scripts/build.py --check
      - run: python -m unittest discover -s tests -v
